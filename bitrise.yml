format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  sample:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-ios-simple-objc.git
    - TEST_APP_BRANCH: danger
    - PULL_REQUEST_ID: 8
    - GITHUB_API_TOKEN: $GITHUB_API_TOKEN
    steps:
    - script:
        title: Clean _tmp dir
        inputs:
        - content: |-
            #!/bin/env bash
            set -ex
            rm -rf ./_tmp
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
        - is_create_path: true
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - branch: $TEST_APP_BRANCH
        - clone_into_dir: .
    - script:
        title: Set the pull request danger should comment on
        inputs:
        - content: |-
            #!/bin/env bash
            set -ex
            envman add --key BITRISE_PULL_REQUEST --value "$PULL_REQUEST_ID"
    - path::./:
        inputs:
        - repository_url: $TEST_APP_URL
        - github_api_token: $GITHUB_API_TOKEN

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: { }
